output:
  - failure

pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: '*.{ts,tsx,js,mjs,cjs,json,md,css,yml,yaml}'
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: '*.{ts,tsx}'
      run: pnpm exec oxlint --type-aware --deny-warnings {staged_files}
    - name: spell
      glob: '*.{ts,tsx,md,json}'
      run: pnpm exec cspell --no-progress --no-must-find-files {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: verify
      run: pnpm check-types && pnpm lint:deps && pnpm lint:dead
