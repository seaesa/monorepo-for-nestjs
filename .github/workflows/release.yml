name: Release

# release-please keeps a release PR open from Conventional Commits on main (version bump +
# CHANGELOG.md). Merging it tags vX.Y.Z, creates the GitHub release and starts the mobile build.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5

  mobile:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/mobile-release.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
